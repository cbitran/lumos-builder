name: Publicar o Lumos Builder no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publica APENAS a pasta do builder. O bundle das peças vivas
      # (_pecas/lumos-pecas.js) é versionado junto porque o Pages serve arquivo
      # estático — não há passo de build no servidor.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lumos-builder

      - id: deploy
        uses: actions/deploy-pages@v4
